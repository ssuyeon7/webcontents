<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>설문조사</title>
        <link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap" rel="stylesheet">
        <style>
            header{
                border-bottom: 1px solid;
            }
            h1{
                color: brown;
                text-align: center;
            }
            body{
                background: aliceblue;
            }
            p{
                font-family: 'Nanum Pen Script', cursive;
                font-size: 1em;
                text-indent: 1em;
            }
            article{
                background:pink ;
                font-family: 'Nanum Pen Script', cursive;
                font-size: 1em;
                text-indent: 1em;
            }
            footer{
                font-family: 'Nanum Pen Script', cursive;
                background: orange;
                border-radius: 10px;
                text-indent: 1em;
            }
        </style>
    </head>
    <body>
        <header>
            <h1>설문지</h1><br>
             <p>소프트웨어 기술에 대한 의견을 듣습니다. 많은 참여 부탁드립니다.</p>
             <hr>
        </header>
        <section>
            <article>
                학년
                <radio name="학년">
                <label><input type="radio" name="학년" value="1">1학년</label>
                <label><input type="radio" name="학년" value="2">2학년</label>
                <label><input type="radio" name="학년" value="3">3학년</label>
                </radio>
                <br><br>
            </article>
            <article>
                성별
                <radio name="성별">
                <input type="radio" name="성별" value="1">남
                <input type="radio" name="성별" value="2">여
                </radio>
                <br><br>
            </article>
            <article>
                관심 분야
                <select name="관심분야">
                    <option value="1">웹 프로그래밍</option>
                    <option value="2">소프트웨어 공학</option>
                    <option value="3">UI/UX 기획</option>
                    <option value="4">알고리즘</option>
                </select>
                <br><br>
            </article>
            <article>
                진로
                <checkbox name="진로">
                    <input type="checkbox" name="진로" value="1">개발
                    <input type="checkbox" name="진로" value="2">기획
                    <input type="checkbox" name="진로" value="3">영업
                    <input type="checkbox" name="진로" value="4">창업
                </checkbox>
                <br><br>
            </article>
            <article>
                남기고 싶은 말
                <textarea cols="40" rows="10" placeholder="글을 남겨주세요"></textarea>
                <br><br>
            </article>
        </section>
        <footer>
             Copyright 2026 by HUH SUYEON
        </footer>
    </body>
</html>
