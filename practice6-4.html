<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>월화수목금토일</title>
    </head>
    <body>
        <h3>월화수목금토일</h3>
        <hr>
        <script>
            let work;
            let day=prompt("월화수목금토일 중에서 입력하세요");
            day=parseInt(day);
            if(day=금)
                work="휴일";
            else if(day=토)
                work="휴일";
            else if(day=일)
                work="휴일";
            else
                work="출근";
            document.write(day+"는"+work+"<br>")
        </script>
    </body>
</html>
